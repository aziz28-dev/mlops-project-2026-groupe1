[project]
name = "bankmlops"
version = "0.1.0"
description = "Plateforme MLOps de ciblage des campagnes de télémarketing bancaire (UCI Bank Marketing)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pandas (>=3.1.1,<4.0.0)", "numpy (>=2.4,<2.5)", "scikit-learn (>=1.9.1,<2.0.0)", "xgboost (>=3.2,<3.3)", "pyyaml (>=6.0.4,<7.0.0)"]

[tool.poetry]
packages = [{ include = "bankmlops", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- qualité du code
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F : erreurs de base · I : tri des imports · UP : syntaxe moderne · B : bugs fréquents · D : docstrings
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]   # pas de docstrings obligatoires dans les tests

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/bankmlops"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "black (>=26.10.1,<27.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "dvc (>=3.67.1,<4.0.0)"
]
