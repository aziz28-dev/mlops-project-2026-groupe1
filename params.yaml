# Tous les paramètres du projet — lus par dvc.yaml et par le code (src/bankmlops/config.py).
# Modifier ici, jamais en dur dans le code.

seed: 42

data:
  source_url: https://archive.ics.uci.edu/static/public/222/bank+marketing.zip
  raw_dir: data/raw
  raw_csv: data/raw/bank-additional-full.csv
  expected_rows: 41188            # bank-additional-names.txt, section 5
  separator: ";"
  target: y
  positive_label: "yes"
  drop_columns: [duration]        # data leakage : connue seulement après l'appel

split:
  reference_ratio: 0.7            # premières lignes (chronologiques) = référence ; reste = "production"
  test_size: 0.2                  # split stratifié à l'intérieur de la référence

train:
  decision_threshold: 0.5
  selection_metric: pr_auc
  models:
    logreg:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    random_forest:
      n_estimators: 300
      max_depth: 10
      class_weight: balanced
    xgboost:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.1

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: bank-marketing
  registered_model_name: bank-marketing-classifier
  champion_alias: champion

drift:
  ks_pvalue: 0.05
  chi2_pvalue: 0.05
  psi_threshold: 0.20
  psi_bins: 10
  drift_share_threshold: 0.30
