# Lancer `poetry run pre-commit autoupdate` après installation pour récupérer les dernières versions.
# Documents officiels de l'enseignant : jamais modifiés par les hooks.
exclude: ^docs/reference/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^dvc\.lock$     # généré par DVC, qui y laisse des espaces en fin de ligne
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]   # empêche de committer des données dans Git (elles vont dans DVC)
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
